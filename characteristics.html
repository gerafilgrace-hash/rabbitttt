    <h1>Rabbit Characteristics</h1>

    <p>Rabbits are small, furry animals.</p>

    <h3>Characteristics:</h3>

    <ul>
        <li>Long ears</li>
        <li>Soft fur</li>
        <li>Short fluffy tail</li>
        <li>Strong hind legs</li>
        <li>Herbivorous animals</li>
        <li>Can hop and run fast</li>
    </ul>

    <h3>Fun Fact!</h3>
    <p>Rabbit teeth grow continuously throughout their lives.</p>
